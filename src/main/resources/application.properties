spring.application.name=Movi
# H2 Connection Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.datasource.driver-class-name=org.h2.Driver

# JWT Configuration
# Local fallback only, production must provide MOVI_JWT_SECRET.
app.security.jwt.secret-key=${MOVI_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.security.jwt.expiration=86400000
app.security.jwt.refresh-token.expiration=604800000


